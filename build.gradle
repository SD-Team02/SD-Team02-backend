plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux' // AI(Gemini) 연동용 WebClient
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	//LLM-RAG
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-transformers'
	//vectorDB 추가
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	//document reader 추가
	implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
	// aws s3
	implementation platform('software.amazon.awssdk:bom:2.46.15')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:auth'

	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	developmentOnly 'me.paulschwarz:springboot3-dotenv:5.1.0' // .env 파일을 로컬 개발 시 자동 로드 (운영 빌드엔 미포함)
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}
//LLM-RAG
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.1"
    }
}

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
	file(querydslDir).deleteDir()
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트 실행 로그를 콘솔에서 확인할 수 있도록 설정
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = "full"
		showCauses = true
		showStackTraces = true
	}
}

spring:
  datasource:
    url: jdbc:h2:mem:delivery_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: testsecretkeyforjunitonlynotforproductionuse
    access-token-expire-ms: 3600000
    refresh-token-expire-ms: 1209600000
  auth:
    token:
      master: test-master-token
      manager: test-manager-token
      owner: test-owner-token
  ai:
    gemini:
      api-key: test-key
      model: gemini-2.5-flash-lite
      base-url: https://generativelanguage.googleapis.com/v1beta
      max-input-length: 300

cloud:
  aws:
    access-key: test-access-key
    secret-key: test-secret-key
    region: ap-northeast-2
    s3:
      bucket: test-bucket
      presigned-url-expiration: 1h

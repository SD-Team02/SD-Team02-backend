spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_local
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # 로컬 개발 편의용. dev/prod에서는 validate + Flyway/Liquibase 권장
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

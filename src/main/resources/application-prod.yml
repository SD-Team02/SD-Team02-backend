spring:
  datasource:
    url: ${DB_URL} # 예: jdbc:postgresql://<RDS 엔드포인트>:5432/delivery
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # 임시: 아직 Flyway 미도입, 최초 스키마 생성을 위해 update 사용 (Flyway 도입 시 validate로 되돌릴 것)
    show-sql: false
  ai:
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
    vectorstore:
      pgvector:
        initialize-schema: true # local엔 있었는데 prod에 누락됨: 없으면 RDS에 vector_store 테이블/extension이 안 만들어져서 VectorInitializer가 시작 시점에 크래시남
  servlet: # 이미지 저장 용량 (기본값 1MB라 사진 업로드가 대부분 실패함, local과 동일하게 맞춤)
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    enabled: true # 데모용으로 임시 활성화 (데모 끝나면 false로 되돌리는 것 권장)
  api-docs:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET} # 기본값 없음: 운영에 값 안 넣으면 기동 자체가 실패하도록 함
  ai:
    gemini:
      api-key: ${AI_API_KEY}

cloud: # aws s3 이미지 저장 (application-local.yml과 동일 구조)
  aws:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: 1h

logging:
  level:
    root: WARN
    com.example.delivery: INFO
  file:
    name: /var/log/delivery-platform/app.log

server:
  forward-headers-strategy: framework
server:
  port: 8080

spring:
  application:
    name: delivery
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true # Hibernate가 테이블 만든 "후" schema.sql이 실행되도록 순서 보장 (부분 유니크 인덱스용)
  sql:
    init:
      mode: always # 기본값(embedded)은 H2 등 임베디드 DB에서만 schema.sql을 실행함. local/prod는 진짜 PostgreSQL이라 always로 명시해야 실행됨
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # 가게 목록 조회시 평균 평점 등 연관 조회 N+1 완화
  ai: # spring ai 사용하여 변경
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
        embedding:
          options:
            model: text-embedding-004

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-ms: 3600000       # 1시간
    refresh-token-expire-ms: 1209600000   # 14일
  auth:
    token:
      master: ${MASTER_TOKEN}
      manager: ${MANAGER_TOKEN}
      owner : ${OWNER_TOKEN}

  pagination:
    allowed-sizes: [10, 30, 50]
    default-size: 10
    default-sort: createdAt,desc

logging:
  level:
    root: INFO
    com.example.delivery: DEBUG

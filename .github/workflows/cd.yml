name: CD - Build & Push Docker Image, Deploy to EC2

# main 브랜치에 merge되면:
#   1) GitHub Actions에서 테스트 실행 + Docker 이미지 빌드 (EC2가 아닌 CI 러너에서 빌드 — 이유는 README/문서 참고: EC2 RAM 1GB + 버스터블 CPU 크레딧 보호, 빌드 툴체인을 프로덕션 서버에 안 두어 공격 표면 축소)
#   2) 빌드한 이미지를 Docker Hub(public repo)로 push
#   3) EC2에 SSH로 접속해 최신 이미지를 pull 받아 컨테이너 재실행
#
# 보안 참고: Docker Hub가 public repo라 이미지 내용은 누구나 pull 가능하다.
#   - 이미지 자체에는 시크릿(DB_URL, JWT_SECRET, AI_API_KEY 등)을 절대 포함하지 않는다.
#   - 모든 시크릿은 EC2에서 컨테이너를 "실행하는 시점"에 -e 옵션으로만 주입한다 (Dockerfile/이미지 레이어에는 없음).
#   - 멀티스테이지 빌드로 최종 이미지에는 소스코드/Gradle 캐시가 남지 않는다 (JRE + JAR만 존재).
#
# 사전 준비 (GitHub Repo Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN     - Docker Hub 로그인 정보 (TOKEN은 Access Token, 비밀번호 아님)
#   EC2_HOST, EC2_USERNAME, EC2_SSH_KEY     - EC2 접속 정보
#   DB_URL, DB_USERNAME, DB_PASSWORD        - 운영 DB 접속 정보 (RDS)
#   JWT_SECRET, AI_API_KEY              - 운영 시크릿 값
#   MASTER_TOKEN, MANAGER_TOKEN, OWNER_TOKEN - 역할별 정적 인증 토큰
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET, AWS_REGION - S3 이미지 업로드용
#
# EC2 사전 세팅 (최초 1회, 수동):
#   - Docker 설치 (sudo apt install docker.io 또는 공식 스크립트)
#   - 기존 JAR 직접실행용 systemd 서비스(delivery-app.service)는 제거/비활성화

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sd-team02-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 실행 (배포 전 게이트)
        run: ./gradlew test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 세팅
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2026-07-20 blue-green 무중단 배포 재검증
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 접속 → 이미지 pull → 컨테이너 재배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          MANAGER_TOKEN: ${{ secrets.MANAGER_TOKEN }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,AI_API_KEY,MASTER_TOKEN,MANAGER_TOKEN,OWNER_TOKEN,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,AWS_REGION
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:latest

            # --- 블루-그린 무중단 배포 ---
            # 기존 방식(같은 포트에 stop→run)은 새 컨테이너가 기동 실패해도 이미
            # 기존 컨테이너를 지운 뒤라 사이트 전체가 죽는 문제가 있었다.
            # 대신 blue(8080)/green(8081) 두 컨테이너를 번갈아 쓰고,
            # nginx upstream(/etc/nginx/conf.d/upstream.conf)이 가리키는 포트만 전환한다.
            # 새 컨테이너 헬스체크가 실패하면 nginx는 절대 건드리지 않아
            # 기존 컨테이너가 계속 트래픽을 받는다 (배포 실패 = 무해).

            CURRENT_PORT=$(grep -oP 'server 127\.0\.0\.1:\K[0-9]+' /etc/nginx/conf.d/upstream.conf)

            if [ "$CURRENT_PORT" = "8080" ]; then
              NEW_COLOR=green; NEW_PORT=8081
              OLD_COLOR=blue;  OLD_PORT=8080
            else
              NEW_COLOR=blue;  NEW_PORT=8080
              OLD_COLOR=green; OLD_PORT=8081
            fi

            echo "현재 서빙 중: $OLD_COLOR($OLD_PORT) → 새로 배포할 곳: $NEW_COLOR($NEW_PORT)"

            docker stop delivery-app-$NEW_COLOR 2>/dev/null || true
            docker rm delivery-app-$NEW_COLOR 2>/dev/null || true

            # 시크릿은 이미지가 아니라 여기서 컨테이너 실행 시점에만 주입된다.
            # JAVA_TOOL_OPTIONS: EC2가 RAM 1GB짜리라 -Xmx 명시 안 하면 JVM 기본 힙이
            # 너무 작게 잡혀서 RAG 임베딩 모델(ONNX) 로딩 중 OOM남. 스왑 1GB와 함께 사용.
            docker run -d \
              --name delivery-app-$NEW_COLOR \
              --restart unless-stopped \
              -p 127.0.0.1:$NEW_PORT:8080 \
              -e JAVA_TOOL_OPTIONS="-Xmx512m" \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e AI_API_KEY="$AI_API_KEY" \
              -e MASTER_TOKEN="$MASTER_TOKEN" \
              -e MANAGER_TOKEN="$MANAGER_TOKEN" \
              -e OWNER_TOKEN="$OWNER_TOKEN" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              -e AWS_REGION="$AWS_REGION" \
              ${{ env.IMAGE_NAME }}:latest

            # 헬스체크: 새 컨테이너 포트로만 확인 — 이 시점엔 아직 트래픽이 안 넘어간 상태라
            # 실패해도 사용자에게 영향 없음. RAG 임베딩 로딩까지 포함해서 30초 내외 걸리므로
            # 여유 있게 20회(최대 60초) 재시도한다.
            echo "새 컨테이너($NEW_COLOR:$NEW_PORT) 헬스체크 시작..."
            HEALTHY=0
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$NEW_PORT || echo "000")
              if [ "$STATUS" != "000" ]; then
                echo "새 컨테이너 정상 응답 확인 (HTTP $STATUS)"
                HEALTHY=1
                break
              fi
              echo "응답 없음, 3초 후 재시도... ($i/20)"
              sleep 3
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "헬스체크 실패 — nginx는 건드리지 않고 기존 $OLD_COLOR($OLD_PORT)가 계속 트래픽을 받는다"
              docker logs --tail 100 delivery-app-$NEW_COLOR || true
              docker rm -f delivery-app-$NEW_COLOR || true
              exit 1
            fi

            # --- 트래픽 전환 ---
            sudo sed -i "s/server 127.0.0.1:$OLD_PORT;/server 127.0.0.1:$NEW_PORT;/" /etc/nginx/conf.d/upstream.conf
            sudo nginx -t
            sudo systemctl reload nginx
            echo "nginx upstream을 $NEW_COLOR($NEW_PORT)로 전환 완료"

            # 전환 직후 실제 도메인 응답도 한 번 더 확인
            sleep 2
            FINAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$NEW_PORT || echo "000")
            if [ "$FINAL_STATUS" = "000" ]; then
              echo "전환 후 확인 실패 — 즉시 이전 $OLD_COLOR($OLD_PORT)로 롤백"
              sudo sed -i "s/server 127.0.0.1:$NEW_PORT;/server 127.0.0.1:$OLD_PORT;/" /etc/nginx/conf.d/upstream.conf
              sudo nginx -t
              sudo systemctl reload nginx
              docker logs --tail 100 delivery-app-$NEW_COLOR || true
              exit 1
            fi

            # 기존 컨테이너 정리
            docker stop delivery-app-$OLD_COLOR || true
            docker rm delivery-app-$OLD_COLOR || true
            docker image prune -f
            echo "배포 완료: $NEW_COLOR($NEW_PORT)가 서빙 중"
